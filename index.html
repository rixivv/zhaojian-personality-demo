<!DOCTYPE html>
<html lang="zh-CN" class="zhaojian-standalone">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livo · 照见我 Demo</title>
<meta name="theme-color" content="#070910">
<link rel="preload" href="assets/personality-report-static.png" as="image" fetchpriority="high">
<link rel="preload" href="assets/personality-report-scheme-3.png" as="image">
<style>
html,body{margin:0;min-height:100%;background:#070910}
</style>
<link rel="stylesheet" href="styles.css?v=zhaojian-standalone-2">
</head>
<body>
<section class="personality-report-demo" aria-label="关于我的人格测试报告">
  <img class="personality-report-demo__screen personality-report-demo__screen--one" src="assets/personality-report-static.png" alt="照见我人格报告方案一">
  <img class="personality-report-demo__screen personality-report-demo__screen--two" src="assets/personality-report-scheme-2.png" alt="照见我人格报告方案二">
  <img class="personality-report-demo__screen personality-report-demo__screen--three" src="assets/personality-report-scheme-3.png" alt="照见我完整总结二级页方案三">
  <button class="personality-scheme-three-action personality-scheme-three-back" id="personalitySchemeThreeBack" type="button" aria-label="返回方案二"></button>
  <button class="personality-scheme-three-action personality-scheme-three-refresh" id="personalitySchemeThreeRefresh" type="button" aria-label="刷新完整总结"></button>
  <button class="personality-scheme-three-action personality-scheme-three-download" id="personalitySchemeThreeDownload" type="button" aria-label="下载完整总结"></button>
  <button class="personality-report-hotspot hotspot-top-left" type="button" aria-label="查看关系模式报告" data-report-hotspot="relationship"></button>
  <button class="personality-report-hotspot hotspot-top-right" type="button" aria-label="查看选择倾向报告" data-report-hotspot="choice"></button>
  <button class="personality-report-hotspot hotspot-bottom-left" type="button" aria-label="查看自我表达报告" data-report-hotspot="expression"></button>
  <button class="personality-report-hotspot hotspot-bottom-right" type="button" aria-label="查看情感共鸣报告" data-report-hotspot="emotion"></button>
  <div class="personality-report-selection" id="personalityReportSelection" aria-hidden="true">
    <span></span>
    <img src="assets/personality-report-star-selected.svg" alt="">
  </div>
  <button class="personality-summary-entry" id="personalitySummaryEntry" type="button" aria-pressed="false">
    <img src="assets/personality-summary-more.svg" alt="">
    <span>我的总结</span>
  </button>

  <div class="personality-report-dialog-layer" id="personalityReportDialog" aria-hidden="true">
    <button class="personality-report-backdrop" type="button" aria-label="关闭人格报告"></button>
    <section class="personality-report-dialog" role="dialog" aria-modal="true" aria-labelledby="personalityReportTitle" tabindex="-1">
      <header class="personality-report-dialog__header">
        <h2 id="personalityReportTitle"></h2>
        <button class="personality-report-dialog__close" type="button" aria-label="关闭人格报告">×</button>
      </header>
      <div class="personality-report-dialog__viewport">
        <div class="personality-report-dialog__content" id="personalityReportContent"></div>
      </div>
    </section>
  </div>
  <div class="personality-summary-dialog-layer" id="personalitySummaryDialog" aria-hidden="true">
    <section class="personality-summary-dialog" role="dialog" aria-modal="true" aria-labelledby="personalitySummaryTitle" tabindex="-1">
      <div class="personality-summary-dialog__actions">
        <button id="personalitySummaryRefresh" type="button" aria-label="刷新我的总结"><span class="personality-summary-refresh-icon"><img src="assets/personality-summary-refresh.svg" alt=""></span></button>
        <button id="personalitySummaryDownload" type="button" aria-label="下载我的总结"><span class="personality-summary-download-icon"><img src="assets/personality-summary-download.svg" alt=""></span></button>
        <button class="personality-summary-dialog__close" type="button" aria-label="关闭我的总结"><img src="assets/summary-close.svg" alt=""></button>
      </div>
      <h2 id="personalitySummaryTitle">H i，立夏</h2>
      <div class="personality-summary-dialog__intro">
        <small>在你来到蒂利亚之东的 <strong>110</strong> 天中：</small>
        <p>你似乎总对那些未说完的话更有耐心。<br>你和 <strong>罗兰</strong> 聊了 <strong>38</strong> 次，却很少追问一个确定的答案；<br>你愿意让沉默多停留一会儿，<br>也愿意相信，一段关系会在自己的时间里慢慢显露。<br>你未必习惯袒露自己，却会为真正重要的人留到很晚。</p>
      </div>
      <div class="personality-summary-dialog__kicker"><span>这些故事，照见了这样的我</span></div>
      <div class="personality-summary-story-map">
        <img class="personality-summary-story-map__path-a" src="assets/summary-path-a.svg" alt="">
        <img class="personality-summary-story-map__path-b" src="assets/summary-path-b.svg" alt="">
        <article class="personality-summary-object personality-summary-object--book">
          <div><img class="glow" src="assets/summary-glow.svg" alt=""><img class="object" src="assets/summary-book.png" alt="未写完的书"></div>
          <h3><span>未写完的</span><strong>书</strong></h3><p>你不急着定义，也不轻易离场</p>
        </article>
        <article class="personality-summary-object personality-summary-object--pen">
          <div><img class="glow" src="assets/summary-glow.svg" alt=""><img class="object" src="assets/summary-pen.png" alt="停在句点前的钢笔"></div>
          <h3><span>停在句点前的</span><strong>钢笔</strong></h3><p>你慎重落笔，也保留余地</p>
        </article>
        <article class="personality-summary-object personality-summary-object--lamp">
          <div><img class="glow" src="assets/summary-glow.svg" alt=""><img class="object" src="assets/summary-lamp.png" alt="深夜仍亮着的台灯"></div>
          <h3><span>深夜仍亮着的</span><strong>台灯</strong></h3><p>你不说挽留，却愿意等候</p>
        </article>
      </div>
    </section>
  </div>
  <div class="personality-summary-download-toast" id="personalitySummaryDownloadToast" role="status" aria-live="polite">图片已下载</div>
</section>
<aside class="personality-scheme-console" aria-label="方案控制台">
  <div class="personality-scheme-console__eyebrow">DEMO CONTROL</div>
  <h2>照见我方案</h2>
  <p>切换不同入口方案，不影响报告内容。</p>
  <div class="personality-scheme-console__options" role="group" aria-label="选择方案">
    <button class="is-active" type="button" data-personality-scheme="1"><b>方案一</b><strong>多维人格分析</strong><span>从选择倾向、情感共鸣、关系模式与自我表达四个维度，结合用户在故事中的真实选择，形成完整的人格分析报告。</span></button>
    <button type="button" data-personality-scheme="2"><b>方案二</b><strong>人格特质提炼</strong><span>结合当前故事内容，从用户的真实行为中提炼核心心理判断，再选取能够承载这一判断的故事物件，生成更凝练、更具象的人格总结。</span></button>
    <button type="button" data-personality-scheme="3"><b>方案三</b><strong>完整总结二级页</strong><span>进入独立二级页，完整呈现关键数据、人格叙事与故事物件总结。</span></button>
  </div>
</aside>
<script src="assets/personality-summary-card-data.js"></script>
<script>
(()=>{
  const demo=document.querySelector('.personality-report-demo');
  const layer=document.getElementById('personalityReportDialog');
  const dialog=layer?.querySelector('.personality-report-dialog');
  const title=document.getElementById('personalityReportTitle');
  const content=document.getElementById('personalityReportContent');
  const selection=document.getElementById('personalityReportSelection');
  const summaryEntry=document.getElementById('personalitySummaryEntry');
  const summaryDialogLayer=document.getElementById('personalitySummaryDialog');
  const summaryDialog=summaryDialogLayer?.querySelector('.personality-summary-dialog');
  const summaryDialogClose=summaryDialogLayer?.querySelector('.personality-summary-dialog__close');
  const summaryRefresh=document.getElementById('personalitySummaryRefresh');
  const summaryDownload=document.getElementById('personalitySummaryDownload');
  const schemeThreeBack=document.getElementById('personalitySchemeThreeBack');
  const schemeThreeRefresh=document.getElementById('personalitySchemeThreeRefresh');
  const schemeThreeDownload=document.getElementById('personalitySchemeThreeDownload');
  const summaryDownloadToast=document.getElementById('personalitySummaryDownloadToast');
  let summaryDownloadToastTimer=0;
  const showSummaryToast=(message)=>{
    if(!summaryDownloadToast) return;
    window.clearTimeout(summaryDownloadToastTimer);
    summaryDownloadToast.textContent=message;
    summaryDownloadToast.classList.remove('is-visible');
    requestAnimationFrame(()=>{
      summaryDownloadToast.classList.add('is-visible');
      summaryDownloadToastTimer=window.setTimeout(()=>summaryDownloadToast.classList.remove('is-visible'),1800);
    });
  };
  const closeButtons=layer?.querySelectorAll('.personality-report-backdrop,.personality-report-dialog__close')||[];
  const reports={
    relationship:{
      title:'关系模式：我是怎样靠近一个人的',
      intro:'你似乎更习惯先观察一个人如何安放沉默，再决定靠近多少。你珍惜亲密，却不急于穿过对方尚未准备打开的门。这样的你，常把记得、等待和留出余地当作在意；偶尔显得克制，其实是在确认彼此都能自在地留在关系里。',
      stories:['罗兰借小说与绿色发带递来试探时，你没有追问他轻轻带过的过去，只把那份偏好记在了心里。','面对施塔恩与军方文件，你主动移开视线。规则之外，你依然选择尊重一个人的边界。','红绸意外后，你理解任轻义买下喜缎的善意，也认真接住了他关于同伴的承诺。']
    },
    choice:{
      title:'选择倾向：我通常如何面对故事',
      intro:'你做决定时，常会先看见选择将落在谁身上。你愿意为重要的人与秘密多想一步，也会在真正触碰底线时站出来。你并不总追求最直接的答案，而更在意结果是否对得起当下的自己，以及一路与你同行的人。',
      mbti:{label:'MBTI 倾向',name:'提倡者型倾向',detail:'你更习惯先理解事件背后的意义，再衡量选择会如何影响他人。直觉让你关注长远方向，共情使你照顾关系，判断偏好则推动你把模糊感受整理成行动。这不是固定标签，而是当前故事中反复显现的人格倾向。'},
      stories:['面对被监听的电话，你用与父亲约定的暗语守住了关于 XK-101 的秘密。','老兵险些摔倒时你伸手扶住了他；贵妇轻慢万晁人时，你又让她重新看见自己的傲慢。','罗兰借小说递来试探，你读懂了，却没有拆穿或迎合，而是保留了自己的判断。']
    },
    expression:{
      title:'自我表达：我如何说出自己',
      intro:'你似乎习惯先把情绪整理成不会打扰别人的样子，再决定要不要说出口。你擅长听懂暗示，也常用沉默保护真正重要的部分。随着故事向前，你正在尝试让别人看见更多真实感受；这不是突然改变，而是一种缓慢生长的坦诚。',
      stories:['你常用一句“没关系”把真正的情绪轻轻带过，像是在替周围的人省心。','在监听电话里，你没有直接说出秘密，而是借熟悉的暗语完成了与父亲之间的表达。','一次次同行后，你开始主动说出自己的感受，不再只让沉默替你回答。']
    },
    emotion:{
      title:'情感共鸣：什么最打动我',
      intro:'你可能比自己以为的，更容易被细小而持续的善意触动。盛大的表达会让你动容，但真正留在心里的，往往是某个人记得你无意说过的话，或在离开前留下一个可供重逢的约定。你对情绪的感受细密，也愿意让它在时间里慢慢显影。',
      stories:['任轻义买下喜缎，把未能说出口的善意藏进一段看似随意的玩笑里，而你读懂了它。','散庭离别前将钢笔交到你手中，请你记录沿途见闻，等待重逢时亲口读给他听。','列车上的那些小事被你长久记住：有人记得你的偏好，也有人在沉默里为你留下一席位置。']
    }
  };
  let lastTrigger=null;
  let currentKey='';
  const openReport=(trigger,key)=>{
    const report=reports[key];
    if(!layer||!report||!title||!content) return;
    lastTrigger=trigger;
    currentKey=key;
    document.querySelectorAll('[data-report-hotspot]').forEach((hotspot)=>hotspot.classList.toggle('is-selected',hotspot===trigger));
    if(selection){
      selection.className=`personality-report-selection is-${key} is-visible`;
      const selectionTitle=selection.querySelector('span');
      if(selectionTitle) selectionTitle.textContent={relationship:'关系模式',choice:'选择倾向',expression:'自我表达',emotion:'情感共鸣'}[key]||'';
    }
    title.textContent=report.title;
    content.innerHTML=`<p>${report.intro}</p>${report.mbti?`<div class="personality-report-mbti"><small>${report.mbti.label}</small><b>${report.mbti.name}</b><p>${report.mbti.detail}</p></div>`:''}<div class="personality-report-stories"><span class="personality-report-stories__line" aria-hidden="true"></span><div class="personality-report-stories__copy">${report.stories.map(story=>`<p>${story}</p>`).join('')}</div></div>`;
    dialog?.classList.toggle('is-long',key==='choice');
    dialog?.classList.toggle('is-emotion',key==='emotion');
    layer.classList.add('is-open');
    layer.setAttribute('aria-hidden','false');
    requestAnimationFrame(()=>dialog?.focus());
  };
  const closeReport=()=>{
    if(!layer) return;
    layer.classList.remove('is-open');
    layer.setAttribute('aria-hidden','true');
    currentKey='';
    if(selection) selection.className='personality-report-selection';
    document.querySelectorAll('[data-report-hotspot]').forEach((hotspot)=>hotspot.classList.remove('is-selected'));
    lastTrigger?.focus();
  };
  const closeSummary=()=>{
    summaryDialogLayer?.classList.remove('is-open');
    summaryDialogLayer?.setAttribute('aria-hidden','true');
    summaryEntry?.setAttribute('aria-pressed','false');
  };
  document.querySelectorAll('[data-report-hotspot]').forEach((hotspot)=>hotspot.addEventListener('click',()=>openReport(hotspot,hotspot.dataset.reportHotspot)));
  closeButtons.forEach((button)=>button.addEventListener('click',closeReport));
  document.querySelectorAll('[data-personality-scheme]').forEach((button)=>button.addEventListener('click',()=>{
    const scheme=button.dataset.personalityScheme||'1';
    document.querySelectorAll('[data-personality-scheme]').forEach((item)=>item.classList.toggle('is-active',item===button));
    demo?.setAttribute('data-scheme',scheme);
    summaryEntry?.setAttribute('aria-pressed','false');
    demo?.classList.remove('is-summary-active');
    currentKey='';
    if(selection) selection.className='personality-report-selection';
    document.querySelectorAll('[data-report-hotspot]').forEach((hotspot)=>hotspot.classList.remove('is-selected'));
    closeReport();
    closeSummary();
  }));
  summaryEntry?.addEventListener('click',()=>{
    demo?.classList.add('is-summary-active');
    summaryEntry.setAttribute('aria-pressed','true');
    closeReport();
    summaryDialogLayer?.classList.add('is-open');
    summaryDialogLayer?.setAttribute('aria-hidden','false');
    requestAnimationFrame(()=>summaryDialog?.focus());
  });
  summaryDialogClose?.addEventListener('click',closeSummary);
  summaryDialogLayer?.addEventListener('click',(event)=>{
    if(event.target===summaryDialogLayer) closeSummary();
  });
  summaryRefresh?.addEventListener('click',()=>{
    summaryRefresh.classList.remove('is-refreshing');
    requestAnimationFrame(()=>summaryRefresh.classList.add('is-refreshing'));
    window.setTimeout(()=>summaryRefresh.classList.remove('is-refreshing'),360);
    showSummaryToast('暂未形成新的总结');
  });
  summaryDownload?.addEventListener('click',()=>{
    const link=document.createElement('a');
    link.href=window.PERSONALITY_SUMMARY_CARD_DATA_URL||'assets/personality-summary-card-hd.png';
    link.download='为自己执笔的人-我的总结.png';
    document.body.appendChild(link);
    link.click();
    link.remove();
    showSummaryToast('图片已下载');
  });
  schemeThreeBack?.addEventListener('click',()=>document.querySelector('[data-personality-scheme="2"]')?.click());
  schemeThreeRefresh?.addEventListener('click',()=>showSummaryToast('暂未形成新的总结'));
  schemeThreeDownload?.addEventListener('click',()=>summaryDownload?.click());
  document.addEventListener('keydown',(event)=>{
    if(event.key==='Escape'&&summaryDialogLayer?.classList.contains('is-open')) closeSummary();
    else if(event.key==='Escape'&&layer?.classList.contains('is-open')) closeReport();
  });
})();
</script>
</body>
</html>
